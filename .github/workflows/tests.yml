name: CI Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
        matrix:
            php: ['8.1', '8.2', '8.3', '8.4']
            symfony: ['6.4.*', '7.4.*', '8.1.*']
            dependencies: ['highest']
            exclude:
                - php: '8.1'
                  symfony: '7.4.*'
                - php: '8.1'
                  symfony: '8.1.*'
                - php: '8.2'
                  symfony: '8.1.*'
                - php: '8.3'
                  symfony: '8.1.*'

    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }} (${{ matrix.dependencies }})

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - name: Configure Symfony Version
        run: |
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Install Dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Run PHPUnit
        run: vendor/bin/phpunit
